global:
  scrape_interval: 15s

scrape_configs:
  # Scrape Books API metrics
  - job_name: 'books-api'
    static_configs:
      - targets: ['host.docker.internal:5000']
    metrics_path: '/metrics'

  # Scrape Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
