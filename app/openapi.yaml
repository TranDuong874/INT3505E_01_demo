openapi: 3.0.3
info:
  title: Books API
  description: |
    A RESTful API for managing books with HATEOAS support.
    
    ## Authentication
    This API uses JWT Bearer token authentication. Get a token from the Auth Server:
    
    ```bash
    curl -X POST http://localhost:3001/auth/login \
      -H "Content-Type: application/json" \
      -d '{"username": "admin", "password": "admin123"}'
    ```
    
    ## Available Users
    | Username | Password | Role | Permissions |
    |----------|----------|------|-------------|
    | admin | admin123 | admin | read, create, update, delete |
    | user | user123 | user | read, create, update |
    | guest | guest123 | guest | read |
    
  version: 1.0.0

servers:
  - url: http://localhost:5000
    description: Local development server

tags:
  - name: Books
    description: Book management operations

paths:
  /v1/books:
    get:
      tags:
        - Books
      summary: List all books
      description: Returns a paginated list of books with HATEOAS links. Requires 'read' permission.
      security:
        - BearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 0
          description: Page number (0-indexed)
        - name: per_page
          in: query
          schema:
            type: integer
            default: 10
          description: Number of items per page
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBooks'
        '401':
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'

    post:
      tags:
        - Books
      summary: Create a new book
      description: Creates a new book record in the database. Requires 'create' permission.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookInput'
      responses:
        '201':
          description: Book created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookHATEOAS'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'

  /v1/books/{book_id}:
    get:
      tags:
        - Books
      summary: Get a book by ID
      description: Returns a single book with HATEOAS links. Requires 'read' permission.
      security:
        - BearerAuth: []
      parameters:
        - name: book_id
          in: path
          required: true
          schema:
            type: integer
          description: The book identifier
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookHATEOAS'
        '401':
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Book not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags:
        - Books
      summary: Update a book
      description: Updates an existing book (partial update supported). Requires 'update' permission.
      security:
        - BearerAuth: []
      parameters:
        - name: book_id
          in: path
          required: true
          schema:
            type: integer
          description: The book identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookUpdate'
      responses:
        '200':
          description: Book updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookHATEOAS'
        '400':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Book not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    delete:
      tags:
        - Books
      summary: Delete a book
      description: Permanently removes a book from the database. Requires 'delete' permission (admin only).
      security:
        - BearerAuth: []
      parameters:
        - name: book_id
          in: path
          required: true
          schema:
            type: integer
          description: The book identifier
      responses:
        '200':
          description: Book deleted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteResponse'
        '401':
          description: Unauthorized - Invalid or missing token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Forbidden - Insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForbiddenError'
        '404':
          description: Book not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT token from Auth Server. Get token via:
        POST http://localhost:3001/auth/login
        
  schemas:
    Link:
      type: object
      properties:
        rel:
          type: string
          example: self
          description: Relationship type
        href:
          type: string
          example: /v1/books/1
          description: URL
        method:
          type: string
          example: GET
          description: HTTP method

    BookInput:
      type: object
      required:
        - title
        - author
      properties:
        title:
          type: string
          example: Clean Code
        author:
          type: string
          example: Robert C. Martin
        price:
          type: number
          example: 29.99
        isbn:
          type: string
          example: 978-0132350884
        in_stock:
          type: boolean
          default: true

    BookUpdate:
      type: object
      properties:
        title:
          type: string
        author:
          type: string
        price:
          type: number
        isbn:
          type: string
        in_stock:
          type: boolean

    BookHATEOAS:
      type: object
      properties:
        id:
          type: integer
          example: 1
        title:
          type: string
          example: Clean Code
        author:
          type: string
          example: Robert C. Martin
        price:
          type: number
          example: 29.99
        isbn:
          type: string
          example: 978-0132350884
        in_stock:
          type: boolean
          example: true
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'

    PaginatedBooks:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BookHATEOAS'
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'
        page:
          type: integer
          example: 0
        per_page:
          type: integer
          example: 10
        total:
          type: integer
          example: 100

    DeleteResponse:
      type: object
      properties:
        message:
          type: string
          example: Book 1 deleted successfully
        links:
          type: array
          items:
            $ref: '#/components/schemas/Link'

    Error:
      type: object
      properties:
        error:
          type: string
          example: Book not found

    ForbiddenError:
      type: object
      properties:
        error:
          type: string
          example: Forbidden
        message:
          type: string
          example: Permission 'delete' required
        your_role:
          type: string
          example: guest
