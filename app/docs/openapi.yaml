openapi: 3.0.3
info:
  title: Library Management API
  description: A RESTful API for managing users, books, book copies, and borrows in a library system. Supports CRUD operations, pagination, search, and HATEOAS-style links.
  version: 1.0.0
servers:
  - url: http://localhost:5000
    description: Local development server
tags:
  - name: Users
    description: Operations related to library users
  - name: Books
    description: Operations related to books and their metadata
  - name: Copies
    description: Operations related to physical book copies
  - name: Borrows
    description: Operations related to borrowing and returning books
  - name: Docs
    description: API documentation endpoints
paths:
  /users:
    post:
      tags:
        - Users
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
              required:
                - username
      responses:
        '201':
          description: User created successfully
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      username:
                        type: string
                      type:
                        type: string
                        example: user
                  _links:
                    type: object
                    properties:
                      self:
                        type: string
                      borrows:
                        type: string
        '400':
          description: Bad request (e.g., username not provided or error)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags:
        - Users
      summary: Get all users with pagination
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        username:
                          type: string
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '404':
          description: Error retrieving users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /users/{user_id}:
    get:
      tags:
        - Users
      summary: Get user details and borrowed books
      parameters:
        - name: user_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: User information
          content:
            application/json:
              schema:
                type: object
                properties:
                  user_id:
                    type: integer
                  username:
                    type: string
                  borrowed_books:
                    type: array
                    items:
                      type: object
                      properties:
                        copy_id:
                          type: integer
                        isbn:
                          type: string
                        book_name:
                          type: string
                        author:
                          type: string
                        is_borrowed:
                          type: boolean
                        start_date:
                          type: string
                          format: date
                        end_date:
                          type: string
                          format: date
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /books:
    post:
      tags:
        - Books
      summary: Add a new book
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isbn:
                  type: string
                book_name:
                  type: string
                  default: unknown
                author:
                  type: string
                  default: unknown
              required:
                - isbn
      responses:
        '201':
          description: Book created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      isbn:
                        type: string
                      book_name:
                        type: string
                      author:
                        type: string
                      type:
                        type: string
                        example: book
                  _links:
                    type: object
                    properties:
                      self:
                        type: string
                      add_copies:
                        type: string
        '400':
          description: Bad request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Book already exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  _links:
                    type: object
                    properties:
                      self:
                        type: string
                      add_copies:
                        type: string
    get:
      tags:
        - Books
      summary: Get all books with pagination and copy stats
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: List of books
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        isbn:
                          type: string
                        book_name:
                          type: string
                        author:
                          type: string
                        total_copies:
                          type: integer
                        available_copies:
                          type: integer
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /books/search:
    get:
      tags:
        - Books
      summary: Search books by name, author, ISBN, or all
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: by
          in: query
          schema:
            type: string
            enum: [all, name, author, isbn]
            default: all
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        isbn:
                          type: string
                        book_name:
                          type: string
                        author:
                          type: string
                        total_copies:
                          type: integer
                        available_copies:
                          type: integer
                  pagination:
                    $ref: '#/components/schemas/Pagination'
                  search:
                    type: object
                    properties:
                      query:
                        type: string
                      search_by:
                        type: string
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /copies/{isbn}:
    post:
      tags:
        - Copies
      summary: Add copies to an existing book
      parameters:
        - name: isbn
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                count:
                  type: integer
                  default: 1
                  minimum: 1
      responses:
        '201':
          description: Copies added
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      isbn:
                        type: string
                      book_name:
                        type: string
                      added_copies:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                      count:
                        type: integer
                      type:
                        type: string
                        example: book_copies
                  _links:
                    type: object
                    properties:
                      book:
                        type: string
        '404':
          description: Book not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /borrows:
    post:
      tags:
        - Borrows
      summary: Borrow a book copy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: integer
                copy_id:
                  type: integer
              required:
                - user_id
                - copy_id
      responses:
        '201':
          description: Borrow created
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: integer
                      user_id:
                        type: integer
                      copy_id:
                        type: integer
                      start_date:
                        type: string
                        format: date
                      type:
                        type: string
                        example: borrow
                  _links:
                    type: object
                    properties:
                      self:
                        type: string
                      user:
                        type: string
                      book_copy:
                        type: string
        '400':
          description: Bad request (e.g., already borrowed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Copy not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags:
        - Borrows
      summary: Get all borrow records with pagination
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: List of borrows
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        user_id:
                          type: integer
                        copy_id:
                          type: integer
                        start_date:
                          type: string
                          format: date
                        end_date:
                          type: string
                          format: date
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '400':
          description: Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /borrows/{borrow_id}:
    patch:
      tags:
        - Borrows
      summary: Return a borrowed book
      parameters:
        - name: borrow_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Book returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  user_id:
                    type: integer
                  copy_id:
                    type: integer
                  start_date:
                    type: string
                    format: date
                  end_date:
                    type: string
                    format: date
                  borrowed_length:
                    type: integer
                  _links:
                    type: object
                    properties:
                      self:
                        type: string
                      user:
                        type: string
        '404':
          description: Borrow record or copy not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Bad request (e.g., already returned)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /openapi.yaml:
    get:
      tags:
        - Docs
      summary: Serve OpenAPI specification
      responses:
        '200':
          description: OpenAPI YAML file
          content:
            text/yaml:
              schema:
                type: string
  /swagger_docs:
    get:
      tags:
        - Docs
      summary: Serve Swagger UI for API documentation
      responses:
        '200':
          description: HTML page for Swagger UI
          content:
            text/html:
              schema:
                type: string
components:
  schemas:
    Pagination:
      type: object
      properties:
        page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        pages:
          type: integer
    Error:
      type: object
      properties:
        error:
          type: string