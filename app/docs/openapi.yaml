openapi: 3.0.3
info:
  title: Library API
  description: A RESTful API for managing books, copies, and user borrowing records in a library system.
  version: 1.0.0
servers:
  - url: /
    description: Base URL

paths:
  # Auth service (separate server on port 3000)
  /token:
    post:
      tags:
        - Auth
      summary: Obtain a JWT access token
      security: []
      servers:
        - url: http://localhost:3000
          description: Auth service (localhost)
        - url: http://127.0.0.1:3000
          description: Auth service (loopback)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
              required:
                - username
                - password
      responses:
        '200':
          description: Token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
                    example: Bearer
        '401':
          description: Invalid username or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /books:
    post:
      tags:
        - Books
      summary: Add a new book to the catalog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isbn:
                  type: string
                  description: The ISBN of the book (required).
                  example: '978-0321765723'
                book_name:
                  type: string
                  description: The title of the book.
                  default: unknown
                author:
                  type: string
                  description: The author of the book.
                  default: unknown
              required:
                - isbn
      responses:
        '201':
          description: Book successfully created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookCreatedResponse'
        '400':
          description: Invalid input (e.g., missing ISBN).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Book with this ISBN already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookConflictResponse'

    get:
      tags:
        - Books
      summary: Get a paginated list of all books
      security:
        - SecurityToken: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage_Books'
      responses:
        '200':
          description: A list of books with total and available copies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookListResponse'
        '400':
          description: Invalid pagination parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /books/search:
    get:
      tags:
        - Books
      summary: Search for books by name, author, or ISBN
      # Public in current code
      parameters:
        - in: query
          name: q
          schema:
            type: string
          description: The search query string.
        - in: query
          name: by
          schema:
            type: string
            enum: [all, name, author, isbn]
            default: all
          description: The field to search within. 'all' searches all fields.
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage_Search'
      responses:
        '200':
          description: A list of matching books with pagination and search context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookSearchResponse'
        '400':
          description: Invalid search or pagination parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /books/{isbn}/copies:
    parameters:
      - in: path
        name: isbn
        schema:
          type: string
        required: true
        description: The ISBN of the book.
    post:
      tags:
        - Copies
      summary: Add multiple copies of an existing book
      # Public in current code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                count:
                  type: integer
                  format: int32
                  minimum: 1
                  default: 1
                  description: The number of copies to add.
      responses:
        '201':
          description: Copies successfully added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CopiesAddedResponse'
        '404':
          description: Book not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Invalid input or database error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    get:
      tags:
        - Copies
      summary: Get a paginated list of all copies for a specific book
      # Public in current code
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage_Copies'
      responses:
        '200':
          description: A paginated list of book copies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookCopiesListResponse'
        '404':
          description: Book not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

# --- NEW BORROWS ENDPOINTS ---
  /borrows:
    post:
      tags:
        - Borrows
      summary: Create a new borrow record (Borrow a book copy)
      # Public in current code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: integer
                  format: int32
                  description: The ID of the user borrowing the book.
                  example: 101
                copy_id:
                  type: integer
                  format: int32
                  description: The ID of the specific book copy being borrowed.
                  example: 5
              required:
                - user_id
                - copy_id
      responses:
        '201':
          description: Book successfully borrowed.
          headers:
            Location:
              schema:
                type: string
                example: /borrows/123
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BorrowCreatedResponse'
        '400':
          description: Invalid input (e.g., missing ID, copy already borrowed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Book copy not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'

    get:
      tags:
        - Borrows
      summary: Get a paginated list of all borrow records
      # Public in current code
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage_Books'
      responses:
        '200':
          description: A paginated list of all borrow records.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BorrowListRecord'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '400':
          description: Invalid pagination parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
          
  /borrows/{borrow_id}:
    parameters:
      - in: path
        name: borrow_id
        schema:
          type: integer
          format: int32
        required: true
        description: The ID of the borrow record to update.
    patch:
      tags:
        - Borrows
      summary: Return a book copy (Completes the borrow record)
      # Public in current code
      requestBody:
        # PATCH usually implies optional body, but the logic forces the return action.
        # We can document it as having an empty body or a token to signify the action.
        description: No body required, the PATCH method alone signifies the return action.
        required: false
      responses:
        '200':
          description: Book successfully returned and borrow record updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BorrowReturnedResponse'
        '400':
          description: Book already returned or other error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Borrow record or associated book copy not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'

# --- END OF NEW BORROWS ENDPOINTS ---

  /api/v1/users:
    post:
      tags:
        - Users (v1)
      summary: Create a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: The desired username.
              required:
                - username
      responses:
        '201':
          description: User successfully created.
          headers:
            Location:
              schema:
                type: string
                example: /users/1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Invalid input (e.g., missing username) or database error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'

    get:
      tags:
        - Users (v1)
      summary: Get a paginated list of all users
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage_Users'
      responses:
        '200':
          description: A paginated list of users.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/users/{user_id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags:
        - Users (v1)
      summary: Get user details by ID
      responses:
        '200':
          description: User details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          description: User not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/users/{user_id}/borrows:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags:
        - Users (v1)
      summary: Get a paginated list of a user's borrow history
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage_Users'
      responses:
        '200':
          description: Paginated borrow records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BorrowListResponse'
        '404':
          description: User not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v2/users:
    get:
      tags:
        - Users (v2)
      summary: Get a paginated list of all users (v2, includes extra info)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage_Users'
      responses:
        '200':
          description: A paginated list of users with v2 schema.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponseV2'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v2/users/{user_id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags:
        - Users (v2)
      summary: Get user details by ID (v2, uses common v1 response)
      responses:
        '200':
          description: User details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '404':
          description: User not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v2/users/{user_id}/borrows:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags:
        - Users (v2)
      summary: Get a paginated list of a user's borrow history (v2, uses common v1 response)
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage_Users'
      responses:
        '200':
          description: Paginated borrow records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BorrowListResponse'
        '404':
          description: User not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  schemas:
    Pagination:
      type: object
      properties:
        page:
          type: integer
          description: Current page number.
        per_page:
          type: integer
          description: Items per page.
        total:
          type: integer
          description: Total number of items (books, users, or borrows).
        pages:
          type: integer
          description: Total number of pages.

    Link:
      type: object
      properties:
        self:
          type: string
          format: uri
        next:
          type: string
          format: uri
        prev:
          type: string
          format: uri
        first:
          type: string
          format: uri
        last:
          type: string
          format: uri

    Error:
      type: object
      properties:
        error:
          type: string
          description: A brief error message.
        message:
          type: string
          description: Optional detailed error message.
        status:
          type: integer
          description: Optional HTTP status code.

    # Book Schemas (Retained for completeness)
    BookListEntry:
      type: object
      properties:
        isbn:
          type: string
        book_name:
          type: string
        author:
          type: string
        total_copies:
          type: integer
          format: int32
        available_copies:
          type: integer
          format: int32
    
    BookConflictResponse:
      type: object
      properties:
        error:
          type: string
          example: 'Book with ISBN 978-0321765723 already exists'
        _links:
          type: object
          properties:
            self:
              type: string
              format: uri
            add_copies:
              type: string
              format: uri

    BookCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            isbn:
              type: string
            book_name:
              type: string
            author:
              type: string
            type:
              type: string
              enum: [book]
        _links:
          type: object
          properties:
            self:
              type: string
              format: uri
            add_copies:
              type: string
              format: uri

    BookListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BookListEntry'
        pagination:
          $ref: '#/components/schemas/Pagination'

    BookSearchResponse:
      allOf:
        - $ref: '#/components/schemas/BookListResponse'
        - type: object
          properties:
            search:
              type: object
              properties:
                query:
                  type: string
                search_by:
                  type: string
    
    # Copy Schemas (Retained for completeness)
    AddedCopy:
      type: object
      properties:
        id:
          type: integer
          format: int32
        is_borrowed:
          type: boolean
        _links:
          type: object
          properties:
            self:
              type: string
              format: uri

    CopiesAddedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            isbn:
              type: string
            book_name:
              type: string
            added_copies:
              type: array
              items:
                $ref: '#/components/schemas/AddedCopy'
            count:
              type: integer
              format: int32
            type:
              type: string
              enum: [book_copies]
        _links:
          type: object
          properties:
            book:
              type: string
              format: uri

    BookCopyDetails:
      type: object
      properties:
        id:
          type: integer
          format: int32
        is_borrowed:
          type: boolean
        _links:
          type: object
          properties:
            copy:
              type: string
              format: uri

    BookCopiesListResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            book:
              type: object
              properties:
                isbn:
                  type: string
                title:
                  type: string
                _links:
                  type: object
                  properties:
                    self:
                      type: string
                      format: uri
            copies_list:
              type: array
              items:
                $ref: '#/components/schemas/BookCopyDetails'
            pagination:
              type: object
              properties:
                page:
                  type: integer
                per_page:
                  type: integer
                total_items:
                  type: integer
                total_pages:
                  type: integer
        _links:
          $ref: '#/components/schemas/Link'
          
    # --- NEW BORROW SCHEMAS ---
    BorrowCreatedResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            id:
              type: integer
              format: int32
              description: The ID of the new borrow record.
            user_id:
              type: integer
              format: int32
            copy_id:
              type: integer
              format: int32
            start_date:
              type: string
              format: date
            type:
              type: string
              enum: [borrow]
        _links:
          type: object
          properties:
            self:
              type: string
              format: uri
            user:
              type: string
              format: uri

    BorrowReturnedResponse:
      type: object
      properties:
        id:
          type: integer
          format: int32
        user_id:
          type: integer
          format: int32
        copy_id:
          type: integer
          format: int32
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        borrowed_length:
          type: integer
          format: int32
          description: Length of the borrow period in days.
        _links:
          type: object
          properties:
            self:
              type: string
              format: uri
            user:
              type: string
              format: uri

    BorrowListRecord:
      type: object
      properties:
        id:
          type: integer
          format: int32
        user_id:
          type: integer
          format: int32
        copy_id:
          type: integer
          format: int32
        start_date:
          type: string
          format: date
          nullable: true
        end_date:
          type: string
          format: date
          nullable: true

    # User Schemas (Retained for completeness)
    UserResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            user_id:
              type: integer
              format: int32
            username:
              type: string
            type:
              type: string
              enum: [user]
        _links:
          type: object
          properties:
            self:
              type: string
              format: uri
            borrows:
              type: string
              format: uri

    UserListItem:
      type: object
      properties:
        id:
          type: integer
          format: int32
        username:
          type: string

    UserListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserListItem'
        pagination:
          $ref: '#/components/schemas/Pagination'
        _links:
          $ref: '#/components/schemas/Link'

    UserListResponseV2:
      allOf:
        - $ref: '#/components/schemas/UserListResponse'
        - type: object
          properties:
            data:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: integer
                    format: int32
                  username:
                    type: string
                  extra_info:
                    type: string
                    enum: [v2]
                    description: Extra field added in v2.

    # Borrow Schemas for /users/{id}/borrows (Retained for completeness)
    BorrowRecord:
      type: object
      properties:
        borrow_id:
          type: integer
          format: int32
        copy_id:
          type: integer
          format: int32
        isbn:
          type: string
        book_name:
          type: string
          nullable: true
        start_date:
          type: string
          format: date-time
          nullable: true
        end_date:
          type: string
          format: date-time
          nullable: true

    BorrowListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BorrowRecord'
        pagination:
          $ref: '#/components/schemas/Pagination'
        _links:
          $ref: '#/components/schemas/Link'

  parameters:
    Page:
      in: query
      name: page
      schema:
        type: integer
        minimum: 1
        default: 1
      description: The page number for pagination.
    
    PerPage_Books:
      in: query
      name: per_page
      schema:
        type: integer
        minimum: 1
        default: 50
      description: Number of books or general items per page.
    
    PerPage_Search:
      in: query
      name: per_page
      schema:
        type: integer
        minimum: 1
        default: 10
      description: Number of search results per page.

    PerPage_Copies:
      in: query
      name: per_page
      schema:
        type: integer
        minimum: 1
        default: 50
      description: Number of book copies per page.
    
    PerPage_Users:
      in: query
      name: per_page
      schema:
        type: integer
        minimum: 1
        default: 10
      description: Number of users/borrows per page.

    UserId:
      in: path
      name: user_id
      schema:
        type: integer
        format: int32
      required: true
      description: The unique ID of the user.

  securitySchemes:
    SecurityToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Use HTTP Bearer auth.

        - Click "Authorize".
        - Paste the raw JWT only (do not include the word `Bearer`).
        - Swagger UI will send `Authorization: Bearer <your-token>` automatically.

  responses:
    Unauthorized:
      description: Authentication is required or token is invalid.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: 'Token missing or invalid'