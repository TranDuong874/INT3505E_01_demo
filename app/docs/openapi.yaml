openapi: 3.0.3
info:
  title: Library API
  description: A RESTful API for managing books, copies, and user borrowing records in a library system with OAuth2 authentication, refresh tokens, roles, and scopes.
  version: 2.0.0
servers:
  - url: /
    description: Flask API Base URL
  - url: http://localhost:8080
    description: Auth Service Base URL
security:
  - OAuth2: []
    description: Base URL

paths:
  # OAuth2 Authentication Service Endpoints
  /oauth/token:
    post:
      tags:
        - Authentication
      summary: Get OAuth2 access token (client_credentials grant)
      description: Obtain an access token using client credentials flow
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                grant_type:
                  type: string
                  enum: [client_credentials]
                  description: OAuth2 grant type
                client_id:
                  type: string
                  description: OAuth2 client identifier
                  example: demo-client
                client_secret:
                  type: string
                  description: OAuth2 client secret
                  example: demo-secret
                scope:
                  type: string
                  description: Requested scopes (space-separated)
                  example: borrows:read borrows:write
                audience:
                  type: string
                  description: Token audience
                  example: flask-api
              required:
                - grant_type
                - client_id
                - client_secret
      responses:
        '200':
          description: Access token successfully issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    description: JWT access token
                  token_type:
                    type: string
                    enum: [Bearer]
                  expires_in:
                    type: integer
                    description: Token expiration time in seconds
                  scope:
                    type: string
                    description: Granted scopes
        '400':
          description: Invalid request (unsupported grant type)
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: unsupported_grant_type
        '401':
          description: Invalid client credentials
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: invalid_client

  /.well-known/openid-configuration:
    get:
      tags:
        - Authentication
      summary: OAuth2/OpenID Connect discovery endpoint
      description: Returns OAuth2 service metadata
      responses:
        '200':
          description: Service metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  issuer:
                    type: string
                    example: http://localhost:8080
                  token_endpoint:
                    type: string
                    example: http://localhost:8080/oauth/token

  # Auth service endpoints (port 3000)
  /token:
    post:
      tags:
        - Auth
      summary: Obtain JWT access and refresh tokens
      description: Authenticate with username and password to receive access token, refresh token, and user information including roles and scopes
      security: []
      servers:
        - url: http://localhost:3000
          description: Auth service (localhost)
        - url: http://127.0.0.1:3000
          description: Auth service (loopback)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: duong
                password:
                  type: string
                  format: password
                  example: password
              required:
                - username
                - password
      responses:
        '200':
          description: Tokens successfully issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid username or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /token/refresh:
    post:
      tags:
        - Auth
      summary: Refresh access token
      description: Use a valid refresh token to obtain a new access token
      security: []
      servers:
        - url: http://localhost:3000
          description: Auth service (localhost)
        - url: http://127.0.0.1:3000
          description: Auth service (loopback)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: The refresh token obtained from /token endpoint
                  example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
              required:
                - refresh_token
      responses:
        '200':
          description: New access token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                    description: New JWT access token
                  token_type:
                    type: string
                    enum: [Bearer]
                  expires_in:
                    type: integer
                    description: Token expiration time in seconds
                    example: 900
        '400':
          description: Missing refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid or expired refresh token
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: Invalid or expired refresh token
                  details:
                    type: string

  /token/revoke:
    post:
      tags:
        - Auth
      summary: Revoke refresh token
      description: Invalidate a refresh token to prevent further use
      security: []
      servers:
        - url: http://localhost:3000
          description: Auth service (localhost)
        - url: http://127.0.0.1:3000
          description: Auth service (loopback)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  description: The refresh token to revoke
              required:
                - refresh_token
      responses:
        '200':
          description: Token successfully revoked
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Token revoked successfully
        '400':
          description: Invalid token or missing refresh_token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  # Proxy endpoint for accessing Flask API through auth service
  /api/borrows:
    get:
      tags:
        - Borrows (via Auth Proxy)
      summary: Get borrows via auth service proxy
      description: Access borrows endpoint through authentication service proxy (requires read:borrows scope)
      security:
        - BearerAuth: [read:borrows]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage_Books'
      responses:
        '200':
          description: A paginated list of all borrow records
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BorrowListRecord'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    post:
      tags:
        - Borrows (via Auth Proxy)
      summary: Create borrow via auth service proxy
      description: Create new borrow record through authentication service proxy (requires write:borrows scope)
      security:
        - BearerAuth: [write:borrows]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: integer
                  format: int32
                copy_id:
                  type: integer
                  format: int32
              required:
                - user_id
                - copy_id
      responses:
        '201':
          description: Book successfully borrowed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BorrowCreatedResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/borrows/{borrow_id}:
    parameters:
      - in: path
        name: borrow_id
        schema:
          type: integer
          format: int32
        required: true
        description: The ID of the borrow record to update
    patch:
      tags:
        - Borrows (via Auth Proxy)
      summary: Return book via auth service proxy
      description: Return book copy through authentication service proxy (requires write:borrows scope)
      security:
        - BearerAuth: [write:borrows]
      responses:
        '200':
          description: Book successfully returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BorrowReturnedResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # Flask API Endpoints (direct access)
  /books:
    post:
      tags:
        - Books
      summary: Add a new book to the catalog
      description: Requires admin role and write:books scope
      security:
        - BearerAuth: [write:books]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isbn:
                  type: string
                  description: The ISBN of the book (required).
                  example: '978-0321765723'
                book_name:
                  type: string
                  description: The title of the book.
                  default: unknown
                author:
                  type: string
                  description: The author of the book.
                  default: unknown
              required:
                - isbn
      responses:
        '201':
          description: Book successfully created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookCreatedResponse'
        '400':
          description: Invalid input (e.g., missing ISBN).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Book with this ISBN already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookConflictResponse'

    get:
      tags:
        - Books
      summary: Get a paginated list of all books
      description: Requires read:books scope
      security:
        - BearerAuth: [read:books]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage_Books'
      responses:
        '200':
          description: A list of books with total and available copies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookListResponse'
        '400':
          description: Invalid pagination parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /books/search:
    get:
      tags:
        - Books
      summary: Search for books by name, author, or ISBN
      description: Requires read:books scope
      security:
        - BearerAuth: [read:books]
      parameters:
        - in: query
          name: q
          schema:
            type: string
          description: The search query string.
        - in: query
          name: by
          schema:
            type: string
            enum: [all, name, author, isbn]
            default: all
          description: The field to search within. 'all' searches all fields.
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage_Search'
      responses:
        '200':
          description: A list of matching books with pagination and search context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookSearchResponse'
        '400':
          description: Invalid search or pagination parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /books/{isbn}/copies:
    parameters:
      - in: path
        name: isbn
        schema:
          type: string
        required: true
        description: The ISBN of the book.
    post:
      tags:
        - Copies
      summary: Add multiple copies of an existing book
      description: Requires admin role and write:books scope
      security:
        - BearerAuth: [write:books]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                count:
                  type: integer
                  format: int32
                  minimum: 1
                  default: 1
                  description: The number of copies to add.
      responses:
        '201':
          description: Copies successfully added.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CopiesAddedResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Book not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '400':
          description: Invalid input or database error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    get:
      tags:
        - Copies
      summary: Get a paginated list of all copies for a specific book
      description: Requires read:books scope
      security:
        - BearerAuth: [read:books]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage_Copies'
      responses:
        '200':
          description: A paginated list of book copies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookCopiesListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Book not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /borrows:
    post:
      tags:
        - Borrows
      summary: Create a new borrow record (Borrow a book copy)
      description: Requires write:borrows scope
      security:
        - BearerAuth: [write:borrows]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                user_id:
                  type: integer
                  format: int32
                  description: The ID of the user borrowing the book.
                  example: 101
                copy_id:
                  type: integer
                  format: int32
                  description: The ID of the specific book copy being borrowed.
                  example: 5
              required:
                - user_id
                - copy_id
      responses:
        '201':
          description: Book successfully borrowed.
          headers:
            Location:
              schema:
                type: string
                example: /borrows/123
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BorrowCreatedResponse'
        '400':
          description: Invalid input (e.g., missing ID, copy already borrowed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Book copy not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    get:
      tags:
        - Borrows
      summary: Get a paginated list of all borrow records
      description: Requires read:borrows scope
      security:
        - BearerAuth: [read:borrows]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage_Books'
      responses:
        '200':
          description: A paginated list of all borrow records.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/BorrowListRecord'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '400':
          description: Invalid pagination parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
          
  /borrows/{borrow_id}:
    parameters:
      - in: path
        name: borrow_id
        schema:
          type: integer
          format: int32
        required: true
        description: The ID of the borrow record to update.
    patch:
      tags:
        - Borrows
      summary: Return a book copy (Completes the borrow record)
      description: Requires write:borrows scope
      security:
        - BearerAuth: [write:borrows]
      requestBody:
        description: No body required, the PATCH method alone signifies the return action.
        required: false
      responses:
        '200':
          description: Book successfully returned and borrow record updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BorrowReturnedResponse'
        '400':
          description: Book already returned or other error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Borrow record or associated book copy not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/users:
    post:
      tags:
        - Users (v1)
      summary: Create a new user
      description: Requires admin role and write:users scope
      security:
        - BearerAuth: [write:users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  description: The desired username.
              required:
                - username
      responses:
        '201':
          description: User successfully created.
          headers:
            Location:
              schema:
                type: string
                example: /users/1
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Invalid input (e.g., missing username) or database error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

    get:
      tags:
        - Users (v1)
      summary: Get a paginated list of all users
      description: Requires read:users scope
      security:
        - BearerAuth: [read:users]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage_Users'
      responses:
        '200':
          description: A paginated list of users.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/users/{user_id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags:
        - Users (v1)
      summary: Get user details by ID
      description: Requires read:users scope
      security:
        - BearerAuth: [read:users]
      responses:
        '200':
          description: User details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: User not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/users/{user_id}/borrows:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags:
        - Users (v1)
      summary: Get a paginated list of a user's borrow history
      description: Requires read:borrows scope
      security:
        - BearerAuth: [read:borrows]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage_Users'
      responses:
        '200':
          description: Paginated borrow records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BorrowListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: User not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v2/users:
    get:
      tags:
        - Users (v2)
      summary: Get a paginated list of all users (v2, includes extra info)
      description: Requires read:users scope
      security:
        - BearerAuth: [read:users]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage_Users'
      responses:
        '200':
          description: A paginated list of users with v2 schema.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponseV2'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v2/users/{user_id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags:
        - Users (v2)
      summary: Get user details by ID (v2, uses common v1 response)
      description: Requires read:users scope
      security:
        - BearerAuth: [read:users]
      responses:
        '200':
          description: User details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: User not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v2/users/{user_id}/borrows:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags:
        - Users (v2)
      summary: Get a paginated list of a user's borrow history (v2, uses common v1 response)
      description: Requires read:borrows scope
      security:
        - BearerAuth: [read:borrows]
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PerPage_Users'
      responses:
        '200':
          description: Paginated borrow records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BorrowListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: User not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  schemas:
    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
          description: JWT access token (short-lived, 15 minutes)
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        refresh_token:
          type: string
          description: JWT refresh token (long-lived, 7 days)
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        token_type:
          type: string
          enum: [Bearer]
          example: Bearer
        expires_in:
          type: integer
          description: Access token expiration time in seconds
          example: 900
        scope:
          type: string
          description: Space-separated list of granted scopes
          example: read:books write:books read:borrows write:borrows

    Pagination:
      type: object
      properties:
        page:
          type: integer
          description: Current page number.
        per_page:
          type: integer
          description: Items per page.
        total:
          type: integer
          description: Total number of items (books, users, or borrows).
        pages:
          type: integer
          description: Total number of pages.

    Link:
      type: object
      properties:
        self:
          type: string
          format: uri
        next:
          type: string
          format: uri
        prev:
          type: string
          format: uri
        first:
          type: string
          format: uri
        last:
          type: string
          format: uri

    Error:
      type: object
      properties:
        error:
          type: string
          description: A brief error message.
        message:
          type: string
          description: Optional detailed error message.
        status:
          type: integer
          description: Optional HTTP status code.

    # Book Schemas
    BookListEntry:
      type: object
      properties:
        isbn:
          type: string
        book_name:
          type: string
        author:
          type: string
        total_copies:
          type: integer
          format: int32
        available_copies:
          type: integer
          format: int32
    
    BookConflictResponse:
      type: object
      properties:
        error:
          type: string
          example: 'Book with ISBN 978-0321765723 already exists'
        _links:
          type: object
          properties:
            self:
              type: string
              format: uri
            add_copies:
              type: string
              format: uri

    BookCreatedResponse:
