openapi: 3.0.0
info:
  title: Library Management API
  description: API for managing books, users, and borrowing records in a simple library system.
  version: 1.0.0
servers:
  - url: /
    description: Base URL for the API
tags:
  - name: books
    description: Operations related to library books and their copies.
  - name: users
    description: Operations related to library users.
  - name: borrows
    description: Operations related to book borrowing and returning.

paths:
  /users:
    get:
      tags:
        - users
      summary: Get a list of all users
      operationId: getAllUsers
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number for pagination.
        - in: query
          name: per_page
          schema:
            type: integer
            default: 10
          description: Number of users per page.
      responses:
        '200':
          description: A paginated list of users.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '404':
          description: Resource not found or other client error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - users
      summary: Create a new user
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
              properties:
                username:
                  type: string
                  description: The user's chosen username.
                  example: 'jane_doe_reader'
      responses:
        '201':
          description: User created successfully.
          headers:
            Location:
              schema:
                type: string
                description: URL of the newly created user resource.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Invalid input or missing username.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/{user_id}:
    get:
      tags:
        - users
      summary: Get a user's details and their borrowing history
      operationId: getUserById
      parameters:
        - in: path
          name: user_id
          schema:
            type: integer
          required: true
          description: The ID of the user to retrieve.
      responses:
        '200':
          description: User details and a list of all their borrow/return records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetailResponse'
        '404':
          description: User not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /books/:
    get:
      tags:
        - books
      summary: Get a paginated list of all books
      operationId: getAllBooks
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number for pagination.
        - in: query
          name: per_page
          schema:
            type: integer
            default: 50
          description: Number of books per page.
      responses:
        '200':
          description: A paginated list of books with copy counts.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookListResponse'
        '400':
          description: Invalid query parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
        - books
      summary: Add a new book to the library catalog
      operationId: addBook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - isbn
              properties:
                isbn:
                  type: string
                  description: The book's ISBN (International Standard Book Number).
                  example: '978-0321765723'
                book_name:
                  type: string
                  description: The title of the book.
                  default: unknown
                  example: 'The Great Novel'
                author:
                  type: string
                  description: The author of the book.
                  default: unknown
                  example: 'A. N. Author'
      responses:
        '201':
          description: Book added successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookResponse'
        '400':
          description: Missing required field (ISBN) or invalid data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Book with this ISBN already exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponseWithLinks'

  /books/search:
    get:
      tags:
        - books
      summary: Search for books by title, author, or ISBN
      operationId: searchBooks
      parameters:
        - in: query
          name: q
          schema:
            type: string
          description: The search query string.
        - in: query
          name: by
          schema:
            type: string
            enum: [all, name, author, isbn]
            default: all
          description: Field to search by.
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number for pagination.
        - in: query
          name: per_page
          schema:
            type: integer
            default: 10
          description: Number of results per page.
      responses:
        '200':
          description: A paginated list of search results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookSearchResponse'
        '400':
          description: Invalid query parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  
  /books/{isbn}/copies:
    post:
      tags:
        - books
      summary: Add one or more copies of an existing book
      operationId: addBookCopies
      parameters:
        - in: path
          name: isbn
          schema:
            type: string
          required: true
          description: The ISBN of the book to add copies for.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                count:
                  type: integer
                  description: The number of copies to add. Defaults to 1.
                  minimum: 1
                  example: 5
      responses:
        '201':
          description: Copies added successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookCopiesResponse'
        '400':
          description: Invalid input.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Book with the specified ISBN not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
        - books
      summary: Get a paginated list of all copies for a specific book
      operationId: getCopiesByBookISBN
      parameters:
        - in: path
          name: isbn
          schema:
            type: string
          required: true
          description: The ISBN of the book.
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number for pagination.
        - in: query
          name: per_page
          schema:
            type: integer
            default: 50
          description: Number of copies per page.
      responses:
        '200':
          description: A paginated list of the book's copies.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookCopyListResponse'
        '404':
          description: Book with the specified ISBN not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Server error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /borrows:
    post:
      tags:
        - borrows
      summary: Record a new book borrowing (checkout)
      operationId: borrowBook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - user_id
                - copy_id
              properties:
                user_id:
                  type: integer
                  description: The ID of the user borrowing the book.
                  example: 1
                copy_id:
                  type: integer
                  description: The ID of the specific book copy being borrowed.
                  example: 101
      responses:
        '201':
          description: Book successfully borrowed.
          headers:
            Location:
              schema:
                type: string
                description: URL of the newly created borrow record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BorrowResponse'
        '400':
          description: Missing parameters or book copy already borrowed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Book copy not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
        - borrows
      summary: Get a list of all borrowing records
      operationId: getAllBorrows
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            default: 1
          description: Page number for pagination.
        - in: query
          name: per_page
          schema:
            type: integer
            default: 50
          description: Number of records per page.
      responses:
        '200':
          description: A paginated list of borrow records.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BorrowListResponse'
        '400':
          description: Invalid query parameters.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /borrows/{borrow_id}:
    patch:
      tags:
        - borrows
      summary: Record the return of a book (update borrow record)
      operationId: returnBook
      parameters:
        - in: path
          name: borrow_id
          schema:
            type: integer
          required: true
          description: The ID of the active borrow record to mark as returned.
      responses:
        '200':
          description: Book successfully returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BorrowReturnResponse'
        '400':
          description: Book already returned or invalid request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Borrow record or book copy not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    # --- General Schemas ---
    Link:
      type: object
      additionalProperties:
        type: string
        format: url
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: A human-readable error message.
          example: 'ISBN is required'
    ErrorResponseWithLinks:
      allOf:
        - $ref: '#/components/schemas/ErrorResponse'
        - type: object
          properties:
            _links:
              $ref: '#/components/schemas/Link'
    Pagination:
      type: object
      properties:
        page:
          type: integer
          description: The current page number.
        per_page:
          type: integer
          description: Items per page.
        total:
          type: integer
          description: Total number of items across all pages.
        pages:
          type: integer
          description: Total number of pages.

    # --- Book Schemas ---
    Book:
      type: object
      properties:
        isbn:
          type: string
          description: The book's ISBN.
        book_name:
          type: string
        author:
          type: string
        type:
          type: string
          example: book
    BookWithCopiesSummary:
      allOf:
        - $ref: '#/components/schemas/Book'
        - type: object
          properties:
            total_copies:
              type: integer
              description: Total number of copies of this book in the library.
            available_copies:
              type: integer
              description: Number of copies currently not borrowed.

    BookResponse:
      type: object
      properties:
        data:
          $ref: '#/components/schemas/Book'
        _links:
          $ref: '#/components/schemas/Link'
    BookListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BookWithCopiesSummary'
        pagination:
          $ref: '#/components/schemas/Pagination'
    BookSearchResponse:
      allOf:
        - $ref: '#/components/schemas/BookListResponse'
        - type: object
          properties:
            search:
              type: object
              properties:
                query:
                  type: string
                search_by:
                  type: string
                  enum: [all, name, author, isbn]
    
    # --- Book Copy Schemas ---
    BookCopyItem:
      type: object
      properties:
        id:
          type: integer
          description: Unique ID for the specific book copy.
        is_borrowed:
          type: boolean
        _links:
          $ref: '#/components/schemas/Link'
    BookCopiesResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            isbn:
              type: string
            book_name:
              type: string
            added_copies:
              type: array
              items:
                $ref: '#/components/schemas/BookCopyItem'
            count:
              type: integer
            type:
              type: string
              example: book_copies
        _links:
          $ref: '#/components/schemas/Link'
    BookCopyListResponse:
      type: object
      properties:
        data:
          type: object
          properties:
            book:
              type: object
              properties:
                isbn:
                  type: string
                title:
                  type: string
                _links:
                  $ref: '#/components/schemas/Link'
            copies_list:
              type: array
              items:
                $ref: '#/components/schemas/BookCopyItem'
            pagination:
              type: object
              properties:
                page:
                  type: integer
                per_page:
                  type: integer
                total_items:
                  type: integer
                total_pages:
                  type: integer
        _links:
          $ref: '#/components/schemas/Link'

    # --- User Schemas ---
    UserItem:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
    UserResponse:
      type: object
      properties:
        data:
          allOf:
            - $ref: '#/components/schemas/UserItem'
            - type: object
              properties:
                type:
                  type: string
                  example: user
        _links:
          $ref: '#/components/schemas/Link'
    UserListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/UserItem'
        pagination:
          $ref: '#/components/schemas/Pagination'
    UserBorrowHistoryItem:
      type: object
      properties:
        copy_id:
          type: integer
        isbn:
          type: string
        book_name:
          type: string
        author:
          type: string
        is_borrowed:
          type: boolean
          description: True if the book is currently borrowed (end_date is null).
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
          nullable: true
    UserDetailResponse:
      type: object
      properties:
        user_id:
          type: integer
        username:
          type: string
        borrowed_books:
          type: array
          description: A list of all borrow records associated with this user (past and current).
          items:
            $ref: '#/components/schemas/UserBorrowHistoryItem'

    # --- Borrow Schemas ---
    BorrowBase:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        copy_id:
          type: integer
        start_date:
          type: string
          format: date
    BorrowItem:
      allOf:
        - $ref: '#/components/schemas/BorrowBase'
        - type: object
          properties:
            end_date:
              type: string
              format: date
              nullable: true

    BorrowResponse:
      type: object
      properties:
        data:
          allOf:
            - $ref: '#/components/schemas/BorrowBase'
            - type: object
              properties:
                type:
                  type: string
                  example: borrow
        _links:
          $ref: '#/components/schemas/Link'
    BorrowReturnResponse:
      allOf:
        - $ref: '#/components/schemas/BorrowItem'
        - type: object
          properties:
            borrowed_length:
              type: integer
              description: The number of days the book was borrowed.
            _links:
              $ref: '#/components/schemas/Link'
    BorrowListResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/BorrowItem'
        pagination:
          $ref: '#/components/schemas/Pagination'